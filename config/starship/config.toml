[gcloud]
symbol = "󱇶"
style = "bg:#212736"
format = '[[ $symbol $account(@$domain)( \($region\)) ](fg:#769ff0 bg:#212736)]($style)'
# Only show when a gcloud config is explicitly selected for the shell
detect_env_vars = ["CLOUDSDK_CONFIG", "CLOUDSDK_ACTIVE_CONFIG_NAME", "CLOUDSDK_CORE_PROJECT"]


symbol = "󱃾"
style = "bg:#212736"
format = '[[ $symbol $context( \($namespace\)) ](fg:#769ff0 bg:#212736)]($style)'
disabled = false
# Only show inside Kubernetes projects instead of every directory
detect_files = ["Chart.yaml", "kustomization.yaml", "skaffold.yaml", "helmfile.yaml"]
detect_folders = ["k8s", "kubernetes", "charts", "helm"]


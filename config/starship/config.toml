continuation_prompt = '[▶▶ ](fg:#769ff0)'

# Statusline for Claude Code: `starship statusline claude-code`
[profiles]
claude-code = """
$claude_model\
[](fg:#a3aed2 bg:#769ff0)\
$directory\
([](fg:prev_bg bg:#394260)\
$git_branch\
$git_status)\
[](fg:prev_bg bg:#212736)\
$claude_context\
[](fg:#212736 bg:#1d2230)\
$claude_cost\
[ ](fg:#1d2230)"""

[claude_model]
symbol = "󰚩"
style = "bg:#a3aed2 fg:#090c0c"
format = '[ $symbol $model( \($effort\)) ]($style)'

[claude_context]
gauge_width = 10
format = '[ $gauge $percentage ]($style)'

[[claude_context.display]]
threshold = 0
style = "fg:#769ff0 bg:#212736"

[[claude_context.display]]
threshold = 60
style = "fg:#e0af68 bg:#212736"

[[claude_context.display]]
threshold = 80
style = "fg:#f7768e bg:#212736"

[claude_cost]
symbol = ""
format = '[ $symbol \$$cost ]($style)'

[[claude_cost.display]]
threshold = 0.0
style = "fg:#a0a9cb bg:#1d2230"

[[claude_cost.display]]
threshold = 1.0
style = "fg:#e0af68 bg:#1d2230"

[[claude_cost.display]]
threshold = 5.0
style = "fg:#f7768e bg:#1d2230"

# User / host (only shown over SSH or as root)

[username]
style_user = "bg:#a3aed2 fg:#090c0c"
style_root = "bg:#a3aed2 fg:#c53b53 bold"
format = "[$user ]($style)"

[hostname]
ssh_symbol = ""
style = "bg:#a3aed2 fg:#090c0c"
format = "[$ssh_symbol $hostname ]($style)"

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path]($style)[$read_only]($read_only_style)[ ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:#090c0c bg:#769ff0"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

# Version control

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_commit]
tag_symbol = "  "
style = "bg:#394260"
format = '[[ \($hash$tag\) ](fg:#769ff0 bg:#394260)]($style)'

[git_state]
style = "bg:#394260"
format = '[[ \($state( $progress_current/$progress_total)\) ](fg:#e0af68 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[git_metrics]
added_style = "fg:#9ece6a bg:#394260"
deleted_style = "fg:#f7768e bg:#394260"
format = '([+$added ]($added_style))([-$deleted ]($deleted_style))'

[jj_change]
prefix_style = "fg:#9ece6a bg:#394260 bold"
suffix_style = "fg:#a0a9cb bg:#394260"
change_offset_style = "fg:#769ff0 bg:#394260 bold"
format = '[ ](bg:#394260)$change[ ](bg:#394260)'

[jj_bookmark]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $bookmark(@$remote)$diverged( \(+$overflow_count others\)) ](fg:#769ff0 bg:#394260)]($style)'

[jj_status]
style = "bg:#394260"
format = '[[($all )](fg:#769ff0 bg:#394260)]($style)'

[jj_metrics]
added_style = "fg:#9ece6a bg:#394260"
deleted_style = "fg:#f7768e bg:#394260"
format = '([+$added ]($added_style))([-$deleted ]($deleted_style))'

[hg_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch(:$topic) ](fg:#769ff0 bg:#394260)]($style)'

[hg_state]
style = "bg:#394260"
format = '[[ \($state\) ](fg:#e0af68 bg:#394260)]($style)'

[fossil_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[fossil_metrics]
added_style = "fg:#9ece6a bg:#394260"
deleted_style = "fg:#f7768e bg:#394260"
format = '([+$added ]($added_style))([-$deleted ]($deleted_style))'

[pijul_channel]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $channel ](fg:#769ff0 bg:#394260)]($style)'

[vcsh]
style = "bg:#394260"
format = '[[ vcsh $symbol$repo ](fg:#769ff0 bg:#394260)]($style)'

# Status, timing and system

[cmd_duration]
style = "bg:#1d2230"
format = '[[  $duration ](fg:#a0a9cb bg:#1d2230)]($style)'

[status]
disabled = false
symbol = ""
style = "bg:#1d2230"
format = '[[ $symbol $status ](fg:#f7768e bg:#1d2230)]($style)'

[jobs]
symbol = ""
style = "bg:#1d2230"
format = '[[ $symbol$number ](fg:#a0a9cb bg:#1d2230)]($style)'

[sudo]
symbol = ""
style = "bg:#1d2230"
format = '[[ $symbol ](fg:#a0a9cb bg:#1d2230)]($style)'

[shlvl]
symbol = "󰹍"
style = "bg:#1d2230"
format = '[[ $symbol $shlvl ](fg:#a0a9cb bg:#1d2230)]($style)'

[shell]
style = "bg:#1d2230"
format = '[[ $indicator ](fg:#a0a9cb bg:#1d2230)]($style)'

[memory_usage]
symbol = "󰍛"
style = "bg:#1d2230"
format = '[[ $symbol $ram( | $swap) ](fg:#a0a9cb bg:#1d2230)]($style)'

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "
format = '[ $symbol$percentage ]($style)'

[[battery.display]]
threshold = 10
style = "fg:#f7768e bg:#1d2230 bold"

[localip]
style = "bg:#1d2230"
format = '[[ $localipv4 ](fg:#a0a9cb bg:#1d2230)]($style)'

[time]
disabled = false
time_format = "%R"                                      # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'

